name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check build123d_parts_lib/ tests/ tools/ scripts/

      - name: Validate YAML schemas
        run: |
          python tools/importers/schema/validate.py \
            "build123d_parts_lib/parts/**/*.yaml" \
            --skip-import-check

      - name: Run tests with coverage
        run: |
          pytest --cov=build123d_parts_lib \
                 --cov-report=term-missing \
                 --cov-fail-under=60

      - name: Type check (mypy)
        run: mypy build123d_parts_lib/ --ignore-missing-imports
        continue-on-error: true
