# 拉铆螺母 (Rivet Nut / Blind Rivet Nut / Nutsert) + 弹簧销 (DIN 1481 Spring Pin)
# Standards: rivet-nut 市场惯例 / DIN 1481 (ISO 8752 等效)
# License: MIT

# ─────────────────────────────────────────────────────────────
# 拉铆螺母 / Rivet Nut（薄板内螺纹）
# 安装前形态：圆柱体 + 顶部法兰盘 + 内螺纹
# ─────────────────────────────────────────────────────────────

M3_NUT_RIVET:
  aliases: [M3-rivet-nut, M3-nutsert, M3-blind-rivet-nut]
  standard: "rivet-nut (market convention)"
  type: rivet-nut
  thread:
    d: 3.0
    pitch: 0.50
    unit: mm
  dimensions:
    od: 5.0          # 主体圆柱外径 / barrel OD
    length: 12.0     # 安装前总长 / pre-install length
    flange_d: 7.0    # 法兰盘外径 / flange OD
    flange_t: 1.0    # 法兰盘厚度 / flange thickness
  grip_range_mm: [0.0, 3.0]
  clearance_hole:
    medium_fit: 5.1  # 安装预孔（外径 + 0.1）
  source:
    primary: https://www.bossard.com
    confidence: 4
    last_verified: 2026-04-28
  factory:
    module: build123d_parts_lib.parts.fasteners.rivet_nut
    fn: make_rivet_nut
    args: {size: "M3"}
    cache: cache/m3_rivet_nut.step
  notes: "M3 拉铆螺母（安装前形态：圆柱主体 + 顶部法兰）；薄板内螺纹应用。"

M4_NUT_RIVET:
  aliases: [M4-rivet-nut, M4-nutsert, M4-blind-rivet-nut]
  standard: "rivet-nut (market convention)"
  type: rivet-nut
  thread:
    d: 4.0
    pitch: 0.70
    unit: mm
  dimensions:
    od: 6.0
    length: 13.5
    flange_d: 9.0
    flange_t: 1.2
  grip_range_mm: [0.0, 3.5]
  clearance_hole:
    medium_fit: 6.1
  source:
    primary: https://www.bossard.com
    confidence: 4
    last_verified: 2026-04-28
  factory:
    module: build123d_parts_lib.parts.fasteners.rivet_nut
    fn: make_rivet_nut
    args: {size: "M4"}
    cache: cache/m4_rivet_nut.step
  notes: "M4 拉铆螺母（安装前形态：圆柱主体 + 顶部法兰）；薄板内螺纹应用。"


# ─────────────────────────────────────────────────────────────
# 弹簧销 DIN 1481 / Spring Pin (Slotted)
# 自由状态：开口圆形截面（C 形），纵向缝隙
# 无螺纹，按公称直径命名（D3 / D4）
# ─────────────────────────────────────────────────────────────

D3_DIN1481:
  aliases: [d3-spring-pin, d3-DIN1481, 3mm-spring-pin]
  standard: "DIN 1481"
  type: spring-pin
  nominal:
    d: 3.0
    unit: mm
  dimensions:
    od_free: 3.15    # 自由状态外径（公称 × 1.05）/ free-state OD
    wall_t: 0.8      # 壁厚 / wall thickness
    slit_w: 1.0      # 缝宽 / slit width
  common_lengths_mm: [8, 10, 12, 14, 16, 20]
  source:
    primary: https://www.bossard.com
    confidence: 4
    last_verified: 2026-04-28
  factory:
    module: build123d_parts_lib.parts.fasteners.pin_spring
    fn: make_spring_pin
    args: {nominal_d: 3, length: 12}
    cache: cache/d3_din1481_L12.step
  notes: "DIN 1481 弹簧销（开口圆形截面）；无螺纹，按公称直径查询。"

D4_DIN1481:
  aliases: [d4-spring-pin, d4-DIN1481, 4mm-spring-pin]
  standard: "DIN 1481"
  type: spring-pin
  nominal:
    d: 4.0
    unit: mm
  dimensions:
    od_free: 4.20    # 自由状态外径（公称 × 1.05）/ free-state OD
    wall_t: 1.0
    slit_w: 1.2
  common_lengths_mm: [10, 12, 14, 16, 20, 25]
  source:
    primary: https://www.bossard.com
    confidence: 4
    last_verified: 2026-04-28
  factory:
    module: build123d_parts_lib.parts.fasteners.pin_spring
    fn: make_spring_pin
    args: {nominal_d: 4, length: 12}
    cache: cache/d4_din1481_L12.step
  notes: "DIN 1481 弹簧销（开口圆形截面）；无螺纹，按公称直径查询。"
