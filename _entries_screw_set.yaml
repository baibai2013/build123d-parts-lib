# 内六角紧定螺丝（set screw / grub screw）YAML 入库条目
# Hex socket set screw / grub screw YAML entries
#
# 标准：ISO 4026（平端 / flat point）/ ISO 4028（锥端 / cone point，按用户任务定义；
#       注：ISO 官方 cone point 标准为 ISO 4027（DIN 914），ISO 4028（DIN 915）
#       是 dog point；此处以用户给定的 standard 代号 + 自定义几何为准）
#       / ISO 4029（杯端 / cup point）
# 规格：M3 / M4 / M5；通用长度：M3 4-10、M4 4-12、M5 5-16
# 共 9 条条目（3 端部 × 3 规格）；type tag 由 screw_set.py _load_specs() 路由
#
# Standards: ISO 4026 (flat) / ISO 4028 (cone, per user task spec) / ISO 4029 (cup)
# Sizes: M3 / M4 / M5
# 9 entries total (3 tips × 3 sizes); type tags routed by screw_set.py _load_specs()

# ───────────── ISO 4026 — Flat Point（平端）─────────────
M3_ISO4026:
  aliases: [M3-set-flat, M3-ISO4026, M3-DIN913, m3-grub-flat]
  standard: "ISO 4026 / DIN 913"
  type: socket-set-screw-flat
  thread:
    d: 3.0
    pitch: 0.5
    unit: mm
  head:
    s: 1.5        # 内六角对边宽 / hex socket across-flats
  tip:
    style: flat
    dp_max: 2.00  # 平端面外径上限 / flat face dp max
  common_lengths_mm: [4, 6, 8, 10]
  source:
    primary: https://fullerfasteners.com/tech/iso-4026-specifications-hex-socket-set-screws-with-flat-point/
    confidence: 5
    last_verified: 2026-04-28
  factory:
    module: build123d_parts_lib.parts.fasteners.screw_set
    fn: make_set_screw
    args: {size: "M3", tip: "flat", length: 6}
    cache: cache/m3_set_flat_L6.step
  notes: ISO 4026 M3 内六角平端紧定螺丝。

