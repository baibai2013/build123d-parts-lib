# ============================================================
# DIN 603 Carriage Bolts / 马车螺栓
# ============================================================
# Standard:  DIN 603 / ISO 8678 (mushroom head, square neck)
# Note:      DIN 603 standard starts at M5; M4 here follows market convention.
# Geometry:
#   - Round (mushroom) head dome
#   - Square neck under head (anti-rotation)
#   - Threaded shank below

M4_DIN603:
  aliases: [M4-DIN603, M4-carriage-bolt, M4-coach-bolt]
  standard: "DIN 603 (extended, market convention)"
  type: carriage-bolt

  thread:
    d: 4.0
    pitch: 0.70
    unit: mm

  head:
    dk: 8.0       # 圆头外径 / round head outer diameter
    k:  2.4       # 头高 / head height

  dimensions:
    sq:   4.0     # 方颈对边 / square neck side length
    sq_h: 2.4     # 方颈高度 / square neck depth

  common_lengths_mm: [16, 20, 25, 30]

  factory:
    module: build123d_parts_lib.parts.fasteners.screw_carriage
    fn: make_carriage_bolt
    args: {size: "M4", length: 20.0}
    cache: cache/m4_din603_L20.step

  source:
    primary: https://www.aspenfasteners.com/content/pdf/Metric_DIN_603_spec.pdf
    confidence: 3
    last_verified: 2026-04-28

  notes: "M4 carriage bolt — non-standard size (DIN 603 starts at M5). [unverified — market convention]"


M5_DIN603:
  aliases: [M5-DIN603, M5-carriage-bolt, M5-coach-bolt]
  standard: "DIN 603 / ISO 8678"
  type: carriage-bolt

  thread:
    d: 5.0
    pitch: 0.80
    unit: mm

  head:
    dk: 13.0      # ISO 8678 / DIN 603: dk = 12.45–13.55, mid 13.0
    k:  3.0       # head height (k_min=2.7, market median ~3.0)

  dimensions:
    sq:   5.0     # square neck max = thread d
    sq_h: 3.5     # square neck depth (f_min=2.9, f_max=4.1, mid 3.5)

  common_lengths_mm: [20, 25, 30, 40]

  factory:
    module: build123d_parts_lib.parts.fasteners.screw_carriage
    fn: make_carriage_bolt
    args: {size: "M5", length: 20.0}
    cache: cache/m5_din603_L20.step

  source:
    primary: https://www.aspenfasteners.com/content/pdf/Metric_DIN_603_spec.pdf
    confidence: 5
    last_verified: 2026-04-28

  notes: "M5 carriage bolt per DIN 603 / ISO 8678."
