# ============================================================
# Hex Standoffs / 六角铜柱隔离柱
# ============================================================
# Standard:  市场惯例（非统一标准）/ Market convention (no unified standard)
# Material:  Brass (黄铜) — typical
# Geometry:
#   FF (Female-Female / 双通): both ends internal thread, depth ~0.8*L per end
#   MF (Male-Female / 单通):   one end internal thread, other end male stud
#                              stud length: 6mm (M3), 8mm (M4)

M3_STANDOFF_FF_L10:
  aliases: [M3-standoff-FF-10, M3-spacer-FF-10]
  standard: "Market convention"
  type: hex-standoff-ff

  thread:
    d: 3.0
    pitch: 0.50
    unit: mm

  dimensions:
    s: 5.5            # 对边宽 / across-flats
    length: 10.0      # 总长 / total length

  common_lengths_mm: [5, 8, 10, 12, 16, 20]

  factory:
    module: build123d_parts_lib.parts.fasteners.standoff_hex
    fn: make_hex_standoff
    args: {size: "M3", length: 10.0, style: "FF"}
    cache: cache/m3_standoff_ff_L10.step

  source:
    primary: https://bulkman3d.com/product/hd0042-1/
    confidence: 3
    last_verified: 2026-04-28

  notes: "M3 hex standoff, female-female (双通), L=10mm. [unverified — market convention]"


M3_STANDOFF_MF_L10:
  aliases: [M3-standoff-MF-10]
  standard: "Market convention"
  type: hex-standoff-mf

  thread:
    d: 3.0
    pitch: 0.50
    unit: mm

  dimensions:
    s: 5.5
    length: 10.0
    stud_length: 6.0   # 外螺纹小杆长度

  common_lengths_mm: [5, 8, 10, 12, 16, 20]

  factory:
    module: build123d_parts_lib.parts.fasteners.standoff_hex
    fn: make_hex_standoff
    args: {size: "M3", length: 10.0, style: "MF"}
    cache: cache/m3_standoff_mf_L10.step

  source:
    primary: https://bulkman3d.com/product/hd0042-1/
    confidence: 3
    last_verified: 2026-04-28

  notes: "M3 hex standoff, male-female (单通), L=10mm + 6mm male stud. [unverified — market convention]"


