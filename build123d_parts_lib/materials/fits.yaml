# 公差配合表（mm）
# ISO 标准轴孔配合（H7/h6 等）+ 3D 打印特殊公差
# License: MIT

# ISO 标准间隙配合（孔 - 轴）
# 格式：nominal: [hole_min, hole_max, shaft_min, shaft_max]
iso_h7_h6:       # 最常用间隙配合
  3:   [3.000, 3.010, 2.994, 3.000]
  4:   [4.000, 4.012, 3.992, 4.000]
  5:   [5.000, 5.012, 4.992, 5.000]
  6:   [6.000, 6.012, 5.992, 6.000]
  8:   [8.000, 8.015, 7.991, 8.000]
  10:  [10.000, 10.015, 9.991, 10.000]
  12:  [12.000, 12.018, 11.989, 12.000]
  16:  [16.000, 16.018, 15.989, 16.000]
  20:  [20.000, 20.021, 19.987, 20.000]
  25:  [25.000, 25.021, 24.987, 25.000]

# 过渡配合（半间隙半过盈），如 H7/k6
iso_h7_k6:
  8:   [8.000, 8.015, 8.001, 8.010]
  10:  [10.000, 10.015, 10.001, 10.010]
  12:  [12.000, 12.018, 12.001, 12.012]

# 3D 打印典型配合间隙（每侧，mm）
# 实际值受打印机/切片参数影响较大，以下为经验均值
printing_fit:
  FDM:
    loose:   [0.4, 0.6]      # 免打磨，容易装
    normal:  [0.2, 0.3]      # 标准贴合，需少许力
    tight:   [0.1, 0.15]     # 压配，需打磨或加热
  SLA:
    loose:   [0.15, 0.25]
    normal:  [0.1, 0.15]
    tight:   [0.05, 0.08]

# 常用压配过盈
press_fit:
  bearing_608_into_3dprint:   # 608ZZ 压入 FDM 打印孔
    hole_diameter: 21.8       # 实际 OD=22，留 0.2 mm 过盈
    note: "SLA 可减到 21.9"
  heatset_m3_in_fdm:
    hole_diameter: 4.0
    note: "热压后铜螺母微张开 0.1~0.2 mm 贴合"

notes: |
  使用示例:
      import yaml, pathlib
      fits = yaml.safe_load(
          pathlib.Path("materials/fits.yaml").read_text()
      )
      # 查 ⌀10 的 H7/h6 配合
      h_min, h_max, s_min, s_max = fits["iso_h7_h6"][10]
      print(f"⌀10 孔: {h_min}–{h_max}, 轴: {s_min}–{s_max}")
