# ──────────────────────────────────────────────────────
# 角接触球轴承（Angular Contact Ball Bearing）
# Standards: ISO 7228, JIS B1520, DIN 628-1
# 接触角 15°（C 系列）；外圈推力自由侧带孔肩（单肩截面）
# 通常成对 DB（背靠背）或 DF（面对面）配置，支持双向轴向
# ──────────────────────────────────────────────────────

7001C:
