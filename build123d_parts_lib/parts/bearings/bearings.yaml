# MR 系列微型深沟球轴承（Miniature Deep-Groove Ball Bearing）
# Standards: ISO 15 / JIS B1521
# 适用场景：四足机器人关节轴，D3/D4/D5 转轴配套
# License: MIT
#
# 字段说明：
#   d  = 内径（inner diameter）
#   D  = 外径（outer diameter）
#   B  = 宽度（width）
#   dynamic_c_n  = 基本额定动载荷 C（N）
#   static_c0_n  = 基本额定静载荷 C0（N）
#   max_rpm_grease = 脂润滑极限转速

