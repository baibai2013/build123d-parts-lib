# 精密圆柱销（Cylindrical Dowel Pins）
# Standards: GB/T 119.1 / ISO 8734，公差 m6，淬硬磨削
# 适用场景：四足机器人关节转轴、定位销、铰链轴
# License: MIT
#
# 字段说明：
#   d = 公称直径，tolerance = 配合公差
#   H7_hole = 配对孔推荐公差（过渡配合 H7/m6）
#   clearance_hole_d = 间隙配合孔径（装配拆卸用）
#   chamfer = 两端倒角长度 c（GB/T 119.1）

PIN_D3:
  aliases: [pin-d3, d3-pin, 3mm-pin, GB119-3]
  dimensions:
    d: 3.0
    tolerance: m6
    chamfer: 0.5
    unit: mm
  fit:
    H7_hole: 3.0H7
    clearance_hole_d: 3.2
  material:
    default: "45# steel, HRC58-65"
    optional: "SUS304"
  common_lengths_mm: [8, 10, 12, 16, 20, 25, 30]
  source:
    primary: https://www.misumi-china.com.cn/vona2/detail/110302634310/
    confidence: 5
    last_verified: 2026-04-27
  factory:
    module: build123d_parts_lib.parts.pins.pin_cylindrical
    fn: make_cylindrical_pin
    args: {diameter: 3.0, length: 12}
    cache: cache/pin_d3_L12.step
  notes: |
    四足机器人脚踝/指节转轴；
    FDM 承销孔建议 ⌀3.1mm（+0.1mm 收缩补偿）。

