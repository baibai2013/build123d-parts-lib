SG90:
  aliases: [sg90, tower-pro-sg90, mini-servo-9g, 9g-servo]
  body:
    length: 22.8
    width:  12.2
    height: 22.7
    unit:   mm
  mount:
    ear_width_total: 32.2
    ear_thickness:    2.5
    ear_z_offset:    15.5
    screw_hole_d:     2.0
    screw_pitch:     28.0
  output:
    shaft_height_from_body_top: 5.0
    total_height: 27.7
    spline: "25T"
  torque_kg_cm: 1.2
  weight_g: 9.0
  source:
    primary: https://servodatabase.com/servo/towerpro/sg-90
    confidence: 4
    last_verified: 2026-04-27
  factory:
    module: build123d_parts_lib.parts.servos.standard_servo
    fn: make_servo
    args: {model: SG90}
    cache: cache/sg90.step
  notes: 量产公差 ±0.3mm；FDM 安装腔每侧留 +0.2~0.3mm 间隙。

