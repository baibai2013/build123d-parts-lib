# ──────────────────────────────────────────────────────
# 渐开线齿轮族（ISO 54 / DIN 867 / ISO 23509 / ISO 1122）
# ──────────────────────────────────────────────────────
# 字段说明：
#   module         = 模数 m (mm)
#   teeth          = 齿数 z
#   bore_d         = 中心孔径 (mm)
#   face_width     = 齿宽 (mm)
#   pressure_angle = 压力角（标准 20°）
#   helix_angle    = 螺旋角 β（斜齿轮）
#   mating_teeth   = 配对齿数（锥齿轮，决定节锥角 δ）
#
# 每条目的 `factory.args` 为代表规格；该类型所有规格请见 .py 文件的 __main__ 冒烟测试。
# `cache` 字段指向 scripts/build_cache.py 生成的代表 STEP + PNG 对。

