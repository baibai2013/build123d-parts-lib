# GT2 同步传动件 + 平键（Parallel Key）
# Standards: GT2 (Gates Rubber / RepRap) + ISO 2491 / DIN 6885
# 适用场景：机器人传动轴、3D 打印机运动系统
# License: MIT
#
# 字段说明：
#   teeth      = 齿数
#   bore_d     = 中心孔径（mm）
#   pitch_d    = 节径（mm）
#   od         = 外径（mm）
#   flange_od  = 法兰外径（mm）
#   total_h    = 总高 = 8.0mm（2×法兰1.0 + 带宽6.0）
#   length     = 带周长 / 键长（mm）

