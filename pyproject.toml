[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "build123d-parts-lib"
version = "0.1.0"
description = "Reusable build123d parts, modules, generators, and templates for CAD projects"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "liyijiang"}]
requires-python = ">=3.10"
keywords = ["build123d", "cad", "3d-printing", "parts-library", "mechanical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "build123d>=0.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # line too long — handled by line-length setting
    "E741",   # ambiguous variable name `l` — build123d codebase uses `l` for length
    "F841",   # local variable assigned but never used — build123d context-manager objects appear "unused"
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["build123d_parts_lib"]
omit = ["**/cache/**", "**/__pycache__/**"]

[tool.coverage.report]
fail_under = 60

[project.urls]
Homepage = "https://github.com/liyijiang/build123d-parts-lib"
Issues = "https://github.com/liyijiang/build123d-parts-lib/issues"

[tool.setuptools.packages.find]
include = ["build123d_parts_lib*"]

[tool.setuptools.package-data]
build123d_parts_lib = ["**/*.yaml", "**/*.step"]
