# 直线球轴承（Linear Ball Bearing）规格表
# Standards: ISO 10736 / JIS B 2604（尺寸系列）
# Source: MISUMI LMUU 系列 https://us.misumi-ec.com  + ISO 10736
# Confidence: 5（与 ISO 10736 标准一致）
# License: MIT（ISO 标准尺寸为公知数据）
#
# 字段说明：
#   d   = 内径（轴径）bore diameter (mm)
#   D   = 外径 outer diameter (mm)
#   L   = 总长 overall length (mm)
#   B   = 螺纹间距 thread spacing (mm)
#   d1  = 挡圈槽位置 retaining groove position (mm)
#   dynamic_c_n  = 动载额定负荷 dynamic load rating (N)
#   static_c0_n  = 静载额定负荷 static load rating (N)

