# O 型圈（O-Ring）规格表
# Standards: ISO 3601-1 / GB/T 3452.1
# Source: ISO 3601-1:2012  https://www.iso.org/standard/60058.html
#         GB/T 3452.1-2005 https://openstd.samr.gov.cn
# Confidence: 5（标准文档原文数值）
# License: MIT（ISO/GB 标准尺寸为公知数据）
#
# 字段说明（ISO 3601-1 术语）：
#   d1   = 内径 inside diameter (mm)
#   d2   = 截面直径 cross-section diameter / cord diameter (mm)
#   tol_d1_plus / minus = 内径公差 (mm)
#   tol_d2_plus / minus = 截面公差 (mm)
#
# 常用截面直径系列 d2:
#   1.5mm / 1.78mm / 2.0mm / 2.62mm / 3.53mm
#   （1.78 和 2.62 为 AS 568 美制 O 型圈截面，国内也常见）

# ── d2 = 1.5mm 系列（GB/T 3452.1 常用细截面）──────────────────

